name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build APK
        working-directory: ./frontend
        run: flutter build apk --release

      - name: Upload APK (per-run artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for release
        run: cp frontend/build/app/outputs/flutter-apk/app-release.apk aikya.apk

      # Publishes/updates a single "apk-latest" release so the web app's
      # Install button always has a stable, unauthenticated download URL:
      # https://github.com/<owner>/<repo>/releases/download/apk-latest/aikya.apk
      - name: Publish latest APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Android Build
          body: |
            Automatically published from the latest successful build on `main` (${{ github.sha }}).
            This release is overwritten on every push — it always holds the current build.
          make_latest: true
          files: aikya.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
